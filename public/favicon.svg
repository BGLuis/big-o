<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b6e47" />
      <stop offset="100%" stop-color="#0e432a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#e8a825" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle / Chalkboard -->
  <rect width="64" height="64" rx="16" fill="url(#pineGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#2f8a5e" stroke-width="1.5" opacity="0.6" />

  <!-- Asymptotic Growth Curve (O(n log n)) -->
  <path d="M 12 48 C 22 48, 30 42, 48 16" fill="none" stroke="#f4f1e6" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />

  <!-- Mathematical Big-O Ring -->
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)" />

  <!-- Target node dot on asymptotic curve -->
  <circle cx="48" cy="16" r="2.5" fill="#f4f1e6" opacity="0.9" />
</svg>
